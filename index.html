<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>岩盤浴マニア♨ 全国検索</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f4ed;color:#293e40;font-family:Arial,"Noto Sans JP",sans-serif}
header{background:white;padding:24px 6%;border-bottom:1px solid #e8e1d7}
.logo{font-size:27px;color:#a46a49;font-weight:bold}
small{color:#8a9290;letter-spacing:2px}
main{max-width:700px;margin:auto;padding:35px 20px}
h1{font-size:clamp(25px,5vw,36px);line-height:1.5}
p{line-height:1.9;color:#647271}
.panel{background:white;border:1px solid #e4ded5;border-radius:20px;padding:24px;margin:25px 0;box-shadow:0 5px 18px #00000008}
label{display:block;font-weight:bold;margin:18px 0 8px}
select,input{width:100%;padding:15px;border:1px solid #d7d7d7;border-radius:10px;background:white;font-size:16px}
button{background:#d8804e;color:white;border:0;border-radius:10px;padding:18px;font-size:17px;font-weight:bold;width:100%;margin-top:24px;cursor:pointer}
.quick{display:flex;flex-wrap:wrap;gap:10px}
.quick button{width:auto;margin:0;padding:11px 15px;background:white;color:#293e40;border:1px solid #ddd;border-radius:25px;font-size:14px}
footer{padding:25px;text-align:center;font-size:12px;color:#7a8582}
</style>
</head>
<body>
<header><div class="logo">♨ 岩盤浴マニア</div><small>GANBANYOKU MANIA · JAPAN</small></header>
<main>
<h1>🗾 全国の岩盤浴検索</h1>
<p>全国の岩盤浴施設をGoogleマップで検索。写真・口コミ・営業時間・アクセスを確認できます。</p>
<div class="panel">
<form id="searchForm">
<label for="pref">都道府県</label>
<select id="pref"></select>
<label for="kind">施設の種類</label>
<select id="kind">
<option>岩盤浴</option>
<option>女性専用 岩盤浴</option>
<option>個室 岩盤浴</option>
<option>岩盤浴 スーパー銭湯</option>
<option>岩盤浴 日帰り温泉</option>
</select>
<label for="city">市区町村・施設名（任意）</label>
<input id="city" placeholder="例：中野区、所沢市、施設名">
<button type="submit">🔎 Googleマップで検索する</button>
</form>
</div>
<h2>人気の検索</h2>
<div class="quick">
<button data-q="東京都 中野区 岩盤浴">東京・中野区</button>
<button data-q="東京都 台東区 岩盤浴">東京・台東区</button>
<button data-q="埼玉県 所沢市 岩盤浴">埼玉・所沢市</button>
<button data-q="大阪府 岩盤浴">大阪の岩盤浴</button>
</div>
<p>※検索結果はGoogleマップで開きます。掲載情報は各施設へご確認ください。</p>
</main>
<footer>© 2026 岩盤浴マニア · Googleマップ検索</footer>
<script>
const prefs="北海道 青森県 岩手県 宮城県 秋田県 山形県 福島県 茨城県 栃木県 群馬県 埼玉県 千葉県 東京都 神奈川県 新潟県 富山県 石川県 福井県 山梨県 長野県 岐阜県 静岡県 愛知県 三重県 滋賀県 京都府 大阪府 兵庫県 奈良県 和歌山県 鳥取県 島根県 岡山県 広島県 山口県 徳島県 香川県 愛媛県 高知県 福岡県 佐賀県 長崎県 熊本県 大分県 宮崎県 鹿児島県 沖縄県".split(" ");
const pref=document.getElementById("pref");
prefs.forEach(x=>pref.add(new Option(x,x)));
pref.value="東京都";
function searchMap(q){
location.href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
}
document.getElementById("searchForm").addEventListener("submit",e=>{
e.preventDefault();
searchMap([pref.value,document.getElementById("city").value.trim(),document.getElementById("kind").value].filter(Boolean).join(" "));
});
document.querySelectorAll("[data-q]").forEach(b=>b.addEventListener("click",()=>searchMap(b.dataset.q)));
</script>
</body>
</html>
